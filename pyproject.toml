[project]
name = "lyricsmith"
version = "0.1.0"
description = "Turn a song into timestamped lyrics (Demucs + HeartTranscriptor)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.1",
    "torchaudio>=2.4.1",
    "demucs>=4.0.0",
    "transformers>=4.44.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "scipy>=1.13.0",
    "pyloudnorm>=0.1.1",
    "noisereduce>=3.0.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12.0",
    "huggingface_hub>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "numpy>=1.24",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.scripts]
lyricsmith = "lyricsmith.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lyricsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
